

### get env from file 

apiVersion: v1
kind: Pod
metadata:
  name: my-app
spec:
  volumes:
  - name: shared-data
    emptyDir: {}
  - name: secrets
    secret:
      secretName: my-secret # Assuming ASCP or another mechanism mounts the secret here

  initContainers:
  - name: init-secret
    image: alpine
    volumeMounts:
    - name: shared-data
      mountPath: /etc/shared
    - name: secrets
      mountPath: /etc/secrets
    command: ['sh', '-c', 'echo "export SECRET_KEY=$(cat /etc/secrets/secret-key)" > /etc/shared/secrets.env']

  containers:
  - name: my-app
    image: my-app-image
    volumeMounts:
    - name: shared-data
      mountPath: /etc/shared
    env:
    - name: ENV_SECRETS
      value: "/etc/shared/secrets.env"
    command: ['sh', '-c', 'source $ENV_SECRETS && exec my-app-binary']
