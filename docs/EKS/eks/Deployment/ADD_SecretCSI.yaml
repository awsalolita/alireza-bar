spec:
  template:
    spec:
      volumes:
        - name: myvolSecret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: <ProviderName>
      containers:
        - name: <your-container-name>
          volumeMounts:
            - name: myvolSecret
              mountPath: /app/server.ini
              subPath: <SecretName>
