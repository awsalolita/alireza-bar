spec:
  template:
    spec:
      volumes:
        - name: myvolsecret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: <object name>
      containers:
        - name: <your-container-name>
          volumeMounts:
            - name: myvolsecret
              mountPath: /app/server.ini
              subPath: < aws secret manager name>
