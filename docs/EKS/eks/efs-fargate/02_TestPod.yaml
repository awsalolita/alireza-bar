apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: efs-claim
  containers:
    - name: task-pv-container
      image: nginx
      ports:
        - containerPort: 80
          name: "http-server"
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: vol