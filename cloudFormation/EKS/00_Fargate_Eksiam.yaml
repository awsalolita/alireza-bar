Resources:
  EKSClusterRole:
      Type: 'AWS::IAM::Role'
      Properties:
        RoleName: ArpEKSClusterRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: eks.amazonaws.com
              Action: 'sts:AssumeRole'
        ManagedPolicyArns:
          - 'arn:aws:iam::aws:policy/AmazonEKSServicePolicy'





  EksFargatePodExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AmazonEKSFargatePodExecutionRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks-fargate-pods.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy